[build-system]
requires = ["pdm-backend>=2.4"]
build-backend = "pdm.backend"

[project]
name = "jacl4py"
dynamic = ["version"]
description = "Just another custom logger for Python."
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Fabian Krumm", email = "ghub_fk@gmx.de" },
]
dependencies = [
    "coloredlogs>=15.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.pdm.build]
includes = ["jacl4py/"]
source-includes = ["tests/", ".github/", ".pylintrc", "requirements.txt", "requirements-dev.txt"]

[tool.pdm.version]
source = "file"
path = "jacl4py/__init__.py"